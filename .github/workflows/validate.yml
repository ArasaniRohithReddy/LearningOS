name: Validate catalog

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Registry + self-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild registry (agents / skills / roles → marketplace)
        run: node scripts/build-registry.mjs

      - name: Validate (counts, names, links, footer, Output-shape, Drona allow-list)
        run: node scripts/validate.mjs

      - name: Fail if the committed registry is out of date
        run: |
          if ! git diff --quiet -- marketplace/registry.json marketplace/CATALOG.md; then
            echo "::error::marketplace/registry.json or CATALOG.md is out of date."
            echo "Run 'node scripts/build-registry.mjs' locally and commit the result."
            git --no-pager diff --stat -- marketplace/registry.json marketplace/CATALOG.md
            exit 1
          fi
          echo "Registry is up to date."

  extension-tests:
    name: Extension compile + parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Compile + run feed-parser unit tests
        working-directory: extension
        run: npm test

  mcp-tests:
    name: MCP server build + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP server dependencies
        working-directory: mcp
        run: npm ci

      - name: Build + smoke test (stdio initialize / tools / calls)
        working-directory: mcp
        run: npm test
